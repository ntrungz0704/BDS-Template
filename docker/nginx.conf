server {
    listen 80;
    server_name myplatform.com *.myplatform.com;

    # Bắt buộc chuyển hướng toàn bộ sang kết nối HTTPS an toàn
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name myplatform.com *.myplatform.com;

    # SSL Let's Encrypt Wildcard Certificates
    ssl_certificate /etc/letsencrypt/live/myplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myplatform.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # API Express Backend routing
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js CMS Admin routing
    location /cms/ {
        proxy_pass http://cms:3001;
        # ... standard proxy settings
    }

    # Default routing: Dynamic Subdomain Next.js Websites
    location / {
        proxy_pass http://website:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Next.js custom header truyền subdomain slug sang API
        proxy_set_header x-tenant-slug $host;
    }
}
