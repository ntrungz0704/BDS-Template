# ==============================================================================
# UPSTREAM DEFINITIONS (Internal Docker Network Communication)
# ==============================================================================

upstream marketplace_backend {
    server app-marketplace:3000;
    keepalive 32;
}

upstream cms_backend {
    server app-cms:3001;
    keepalive 32;
}

upstream admin_backend {
    server app-admin:3002;
    keepalive 32;
}

upstream website_backend {
    server app-tenant:3003;
    keepalive 32;
}

upstream api_backend {
    server app-api:5000;
    keepalive 32;
}

# ==============================================================================
# 1. HTTP -> HTTPS REDIRECT & ACME CHALLENGE (Let's Encrypt)
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name aireviewbds.com *.aireviewbds.com;

    # Let's Encrypt ACME Challenge location
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect tất cả traffic HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. MARKETPLACE & TEMPLATES (aireviewbds.com, www.aireviewbds.com, templates.aireviewbds.com)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aireviewbds.com www.aireviewbds.com templates.aireviewbds.com;

    # SSL Certificates (Wildcard hoặc Cert riêng biệt)
    ssl_certificate /etc/letsencrypt/live/aireviewbds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aireviewbds.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    limit_req zone=general_limit burst=20 nodelay;

    location / {
        proxy_pass http://marketplace_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# 3. CMS BUILDER (cms.aireviewbds.com)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.aireviewbds.com;

    ssl_certificate /etc/letsencrypt/live/aireviewbds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aireviewbds.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    limit_req zone=general_limit burst=20 nodelay;

    location / {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# 4. SUPER ADMIN PANEL (admin.aireviewbds.com)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.aireviewbds.com;

    ssl_certificate /etc/letsencrypt/live/aireviewbds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aireviewbds.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    # Bảo mật cao cho trang Admin
    limit_req zone=general_limit burst=10 nodelay;

    location / {
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# 5. API BACKEND (api.aireviewbds.com)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aireviewbds.com;

    ssl_certificate /etc/letsencrypt/live/aireviewbds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aireviewbds.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    # Rate limit cho API
    limit_req zone=api_limit burst=30 nodelay;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# 6. TENANT WEBSITES WILDCARD (*.aireviewbds.com)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.aireviewbds.com;

    # Wildcard Certificate cho Subdomain động
    ssl_certificate /etc/letsencrypt/live/aireviewbds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aireviewbds.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    limit_req zone=general_limit burst=30 nodelay;

    location / {
        proxy_pass http://website_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Header giúp Next.js Tenant App nhận diện Subdomain
        proxy_set_header x-tenant-host $host;
    }
}
